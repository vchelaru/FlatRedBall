name: Glue Tests (PR)

# Runs on pull requests to surface breakage. Advisory only: no check here blocks a merge unless it's
# explicitly marked required in branch protection, which nothing currently is. The existing glue.yml /
# Engine.yml are workflow_dispatch-only publish pipelines (they FTP-upload with secrets) and must not
# run per-PR.
on:
  # Every pull request, whatever its base. No branches: filter, because that filters on the PR's *base*
  # branch, so a PR stacked on another feature branch got no CI at all.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
    - name: Checkout FRB
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        path: 'FlatRedBall'

    - name: Checkout Gum
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/Gum
        fetch-depth: 1
        path: 'Gum'

    - name: Install .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          9.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.0.2

    # No packages.lock.json files are checked in, so the cache key hashes the .csproj files directly
    # (they're what pins package versions here). A miss just falls back to a normal restore and warms
    # the cache for next time -- never a correctness risk, only a speed one.
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Build
      run: dotnet build -c Debug 'FlatRedBall\FRBDK\Glue\Glue with All.sln'

    # Run via the .sln so $(SolutionDir) is defined (OfficialPlugins has a post-build step that needs it).
    #
    # --blame-hang-timeout is a backstop, not an expectation. No single test here runs for minutes (the
    # whole 827-test run below takes about 100s, and the slower steps are slow because of how many tests
    # they have, not how long any one of them takes), so a test sitting for the timeout is wedged and
    # should fail the job rather than sit there until the runner's own limit kills it with no
    # attribution. It also names the test that hung. See issue #1969.
    - name: Run unit tests
      run: dotnet test 'FlatRedBall\FRBDK\Glue\Glue with All.sln' -c Debug --filter "Category!=BuildSmoke&Category!=LiveGame&Category!=SdkMatrix" --blame-hang-timeout 10m

    # The runners have no GPU, so opengl32.dll resolves to Windows' generic OpenGL 1.1, which has no
    # framebuffer objects - MonoGame's GraphicsDevice refuses to initialize on it and the game dies at
    # startup. Mesa's llvmpipe is a software rasterizer that provides a modern GL; Windows resolves
    # opengl32.dll from the exe's own directory before System32, so dropping Mesa's build next to the game
    # overrides the system one. Same approach the Gum repo uses for its raylib and MonoGame suites.
    #
    # LiveGameProcess builds each game into its own temp directory, so it does the copying itself from the
    # directory named here rather than this step staging the DLLs at a fixed path.
    - name: Install Mesa llvmpipe (software GL, no GPU on the runner)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $ProgressPreference = "SilentlyContinue"   # Invoke-WebRequest is far faster without progress rendering
        $ver = "26.1.2"                            # pinned pal1000/mesa-dist-win release
        $asset = "mesa3d-$ver-release-msvc.7z"
        $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$ver/$asset"
        $archive = Join-Path $env:RUNNER_TEMP $asset
        $extract = Join-Path $env:RUNNER_TEMP "mesa"
        # Retried because this feeds a blocking test step, and a transient GitHub releases hiccup should
        # not red the job on the first attempt.
        for ($i = 1; $i -le 3; $i++) {
          try { Write-Host "Downloading $url (attempt $i)"; Invoke-WebRequest -Uri $url -OutFile $archive; break }
          catch {
            if ($i -eq 3) { throw }
            Write-Host "Download failed: $($_.Exception.Message). Retrying in $(5 * $i)s..."
            Start-Sleep -Seconds (5 * $i)
          }
        }
        7z x $archive "-o$extract" -y -bso0 -bsp0
        $opengl = Get-ChildItem -Path $extract -Recurse -Filter opengl32.dll |
                  Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
        if (-not $opengl) { Write-Error "x64 opengl32.dll not found in Mesa archive"; exit 1 }
        "FRB_LIVE_GAME_TEST_GL_RUNTIME=$($opengl.Directory.FullName)" |
          Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "Mesa GL runtime at $($opengl.Directory.FullName)"

    # Category=LiveGame builds Samples/EditorTest1, launches its real .exe, and drives it over the live-edit
    # socket protocol (see LiveGameProcess.cs), so it needs a real MonoGame DesktopGL window. Its own step,
    # not folded into the run above, so a wedged game process is attributed here. Around three minutes, and
    # ahead of the smoke test below so a failure here shows up without waiting out the slowest step.
    - name: Run live game tests
      env:
        GALLIUM_DRIVER: llvmpipe   # force Mesa's software rasterizer, inherited by the game processes
      run: dotnet test 'FlatRedBall\FRBDK\Glue\Glue with All.sln' -c Debug --filter "Category=LiveGame" --blame-hang-timeout 15m

    # Slowest step in the job by far: 69 tests, each copying a sample project out of the repo and loading it
    # through a real headless editor. Needs the net9 SDK (installed above) and network for the first restore.
    - name: Run new-project build smoke test
      run: dotnet test 'FlatRedBall\FRBDK\Glue\Glue with All.sln' -c Debug --filter "Category=BuildSmoke" --blame-hang-timeout 15m

    # Everything above this line covers the Glue editor only. The steps below cover the engine,
    # which otherwise gets compiled just once per release by Engine.yml -- long after the commit
    # that broke it.
    - name: Run engine unit tests
      run: dotnet test 'FlatRedBall\Tests\EngineUnitTests\EngineUnitTests.sln' -c Debug

    # TestProjectDesktopNet6 deliberately does not appear here. Its 440 *.Generated.cs files are
    # gitignored, so it only compiles where Glue has already regenerated it -- a clean checkout
    # cannot build it. scripts/Test-DownstreamBuilds.ps1 covers it locally instead.

    # DebugAutoBuild is the configuration Glue uses to rebuild the engine during live edit, and the
    # only one where FlatRedBall.Forms references SkiaGum at all. Plain Debug does not evaluate that
    # reference, so a broken one survives every other check in this file.
    - name: Build Forms under the Glue live-edit configuration
      run: dotnet build 'FlatRedBall\Engines\Forms\FlatRedBall.Forms\FlatRedBall.Forms.DesktopGLNet6.sln' -c DebugAutoBuild

    # The only sample built here. It exists to demonstrate IDrawableBatch against a third-party
    # library (MonoGame.Extended), so it is the one sample whose value depends on still compiling
    # against both the current engine and a package version we do not control. The rest of
    # Samples\ is unbuilt by CI.
    - name: Build the MonoGame.Extended particle sample
      run: dotnet build 'FlatRedBall\Samples\MonoGameExtendedParticles\MonoGameExtendedParticles.sln' -c Debug

  # GlueCommon (and anything landing alongside it, see #2276) is the one part of the Glue editor with
  # no Windows/WPF dependency, so it and its tests build and run on Linux too. A separate job, not a
  # step in the Windows job above, so it actually proves platform independence rather than just
  # building on a machine that happens to also have Windows-only SDKs installed.
  test-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout FRB
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        path: 'FlatRedBall'

    - name: Checkout Gum
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/Gum
        fetch-depth: 1
        path: 'Gum'

    - name: Install .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Run GlueCommon unit tests
      run: dotnet test 'FlatRedBall/FRBDK/Glue/Tests/GlueCommonUnitTests/GlueCommonUnitTests.csproj' -c Debug

  # Glue evaluates .csproj files with an MSBuild engine it ships (Microsoft.Build in Glue.csproj) reading
  # the targets of whichever installed SDK MsBuildSdkSelector picks, so whether a project loads depends on
  # the user's installed-SDK set. The job above always has .NET 6 installed and proves nothing about a
  # machine without it. Each cell here is a different installed-SDK set, isolated from the runner image's
  # preinstalled SDKs by DOTNET_INSTALL_DIR (setup-dotnet puts that directory first on PATH, and `dotnet
  # --list-sdks` only lists the SDKs under the dotnet root it runs from). Every cell needs an 8.0 SDK to
  # build Glue itself; the rest is the scenario.
  sdk-matrix:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: net6-net8
            sdks: |
              6.0.x
              8.0.x
          - name: net8-only
            sdks: 8.0.x
          # A machine that skipped .NET 6: 3.1 is the newest SDK whose MSBuild Glue's engine can read.
          - name: net3.1-net8-net10
            sdks: |
              3.1.x
              8.0.x
              10.0.x
    name: sdk-matrix (${{ matrix.name }})
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}\dotnet-${{ matrix.name }}
    steps:
    - name: Checkout FRB
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        path: 'FlatRedBall'

    - name: Checkout Gum
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/Gum
        fetch-depth: 1
        path: 'Gum'

    - name: Install .NET (${{ matrix.name }})
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.sdks }}

    - name: Installed SDKs
      run: dotnet --list-sdks

    - name: Build
      run: dotnet build -c Debug 'FlatRedBall\FRBDK\Glue\Glue with All.sln'

    - name: Load checked-in projects with the SDK Glue selects
      run: dotnet test 'FlatRedBall\FRBDK\Glue\Glue with All.sln' -c Debug --no-build --filter "Category=SdkMatrix" --blame-hang-timeout 10m
