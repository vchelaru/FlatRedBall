name: Glue Tests (PR)

# Runs on pull requests to surface breakage. Advisory only: no check here blocks a merge unless it's
# explicitly marked required in branch protection, which nothing currently is. The existing glue.yml /
# Engine.yml are workflow_dispatch-only publish pipelines (they FTP-upload with secrets) and must not
# run per-PR.
on:
  # Every pull request, whatever its base. No branches: filter, because that filters on the PR's *base*
  # branch, so a PR stacked on another feature branch got no CI at all.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
    - name: Checkout FRB
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        path: 'FlatRedBall'

    - name: Checkout Gum
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/Gum
        fetch-depth: 1
        path: 'Gum'

    - name: Install .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          9.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Build
      run: dotnet build -c Debug 'FlatRedBall\FRBDK\Glue\Glue with All.sln'

    # Run via the .sln so $(SolutionDir) is defined (OfficialPlugins has a post-build step that needs it).
    #
    # --blame-hang-timeout is a backstop, not an expectation: these suites run in well under a minute each
    # (see issue #1969), so a test sitting for 10 minutes is wedged and should fail the job rather than sit
    # there until the runner's own limit kills it with no attribution. It also names the test that hung.
    - name: Run unit tests
      run: dotnet test 'FlatRedBall\FRBDK\Glue\Glue with All.sln' -c Debug --filter "Category!=BuildSmoke" --blame-hang-timeout 10m

    # Slower: creates a project from each template and runs `dotnet build` on it. Needs the net9 SDK
    # (installed above) and network for the first NuGet restore.
    - name: Run new-project build smoke test
      run: dotnet test 'FlatRedBall\FRBDK\Glue\Glue with All.sln' -c Debug --filter "Category=BuildSmoke" --blame-hang-timeout 15m

    # Everything above this line covers the Glue editor only. The steps below cover the engine,
    # which otherwise gets compiled just once per release by Engine.yml -- long after the commit
    # that broke it.
    - name: Run engine unit tests
      run: dotnet test 'FlatRedBall\Tests\EngineUnitTests\EngineUnitTests.sln' -c Debug

    # TestProjectDesktopNet6 deliberately does not appear here. Its 440 *.Generated.cs files are
    # gitignored, so it only compiles where Glue has already regenerated it -- a clean checkout
    # cannot build it. scripts/Test-DownstreamBuilds.ps1 covers it locally instead.

    # DebugAutoBuild is the configuration Glue uses to rebuild the engine during live edit, and the
    # only one where FlatRedBall.Forms references SkiaGum at all. Plain Debug does not evaluate that
    # reference, so a broken one survives every other check in this file.
    - name: Build Forms under the Glue live-edit configuration
      run: dotnet build 'FlatRedBall\Engines\Forms\FlatRedBall.Forms\FlatRedBall.Forms.DesktopGLNet6.sln' -c DebugAutoBuild
