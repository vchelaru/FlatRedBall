name: FlatRedBall Editor

on:
  workflow_dispatch:
    inputs:
      PublishTarget:
        description: 'Where to publish this build'
        required: true
        default: 'ftp-frbdk'
        type: choice
        options:
          - ftp-frbdk
          - glue-daily

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        # configuration: [Debug, Release]
        # for now, let's just do debug...
        configuration: [Debug]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    steps:
    - name: Checkout FRB
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        path: 'FlatRedBall'

    - name: Checkout Gum
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/Gum
        fetch-depth: 1
        path: 'Gum'

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          9.0.x

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Build BuildServerUploader
      run: dotnet build -c Debug 'FlatRedBall\FRBDK\BuildServerUploader\BuildServerUploader.sln'
     
    - name: Change version numbers
      if: ${{ github.event.inputs.PublishTarget == 'ftp-frbdk' }}
      run: .\FlatRedBall\FRBDK\BuildServerUploader\BuildServerUploaderConsole\bin\x86\Debug\BuildServerUploaderConsole.exe changefrbdkversion

    # glue-daily uses its own date-based Glue.csproj version rather than the FRBDK-wide one above.
    - name: Bump Glue version for daily build
      if: ${{ github.event.inputs.PublishTarget == 'glue-daily' }}
      shell: pwsh
      run: |
        $csprojPath = 'FlatRedBall\FRBDK\Glue\Glue\Glue.csproj'
        $version = Get-Date -Format "yyyy.M.d"
        $text = Get-Content $csprojPath -Raw
        $text = $text -replace '<Version>[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?</Version>', "<Version>$version</Version>"
        Set-Content $csprojPath $text -NoNewline

    - name: Build
      run: dotnet build -c ${{ matrix.configuration }} 'FlatRedBall\FRBDK\Glue\Glue with All.sln'

    # Run via the .sln so $(SolutionDir) is defined (OfficialPlugins has a post-build step that needs it).
    - name: Run unit tests
      run: dotnet test 'FlatRedBall\FRBDK\Glue\Glue with All.sln' -c ${{ matrix.configuration }} --filter "Category!=BuildSmoke&Category!=LiveGame"

    # Slower: creates a project from each template and runs `dotnet build` on it. Needs the net9 SDK
    # (installed above) and network access for the first NuGet restore.
    - name: Run new-project build smoke test
      run: dotnet test 'FlatRedBall\FRBDK\Glue\Glue with All.sln' -c ${{ matrix.configuration }} --filter "Category=BuildSmoke"

    # Category=LiveGame launches a real MonoGame DesktopGL window - see pr-tests.yml for why it's excluded.

    - name: Zip and upload FRBDK
      if: ${{ github.event.inputs.PublishTarget == 'ftp-frbdk' }}
      env: # Or as an environment variable
        username: ${{ secrets.FTPUSERNAME }}
        password: ${{ secrets.FTPPASSWORD }}
      run: .\FlatRedBall\FRBDK\BuildServerUploader\BuildServerUploaderConsole\bin\x86\Debug\BuildServerUploaderConsole.exe zipanduploadfrbdk "${{ env.username }}" "${{ env.password }}"

    # Rolling pre-release so artists can grab a working Glue build without cloning/building anything.
    # Mirrors what FRBDK/Glue/PublishDailyBuild.ps1 does locally, but from CI (no sibling Gum checkout needed).
    - name: Zip and publish glue-daily release
      if: ${{ github.event.inputs.PublishTarget == 'glue-daily' }}
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $binDir = "FlatRedBall\FRBDK\Glue\Glue\bin\${{ matrix.configuration }}"
        $zipPath = "FlatRedBall\FRBDK\Glue\Glue\bin\GlueDailyBuild.zip"
        Compress-Archive -Path (Join-Path $binDir "*") -DestinationPath $zipPath -Force

        $shortSha = "${{ github.sha }}".Substring(0, 7)
        $date = Get-Date -Format "yyyy-MM-dd HH:mm"
        $notes = "Automated daily build. Not for production - grab whatever's newest.`n`nFlatRedBall commit: $shortSha`nBuilt: $date"

        gh release view glue-daily --repo "${{ github.repository }}" *> $null
        if ($LASTEXITCODE -eq 0) {
          gh release upload glue-daily $zipPath --repo "${{ github.repository }}" --clobber
          gh release edit glue-daily --repo "${{ github.repository }}" --title "Glue Daily Build ($date)" --notes $notes
        } else {
          gh release create glue-daily $zipPath --repo "${{ github.repository }}" --title "Glue Daily Build ($date)" --notes $notes --prerelease
        }

    - name: Package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.configuration }}
        path: FRB/FRBDK/Glue/Glue/bin/${{ matrix.configuration }}
